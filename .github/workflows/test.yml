name: Test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check workflow_cockpit tests
      - run: python -m pytest tests/unit tests/textual tests/contract tests/pty tests/docs -q

  composition-contract:
    # The drift alarm of ADR 0015: committed composition fixtures and the reader
    # must keep agreeing with a real pinned engine. Keep the pin equal to
    # scripts/record-composition-fixtures.sh.
    name: Composition contract (specify-cli 1.1.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m venv "$RUNNER_TEMP/engine" && "$RUNNER_TEMP/engine/bin/pip" install specify-cli==1.1.3
      - run: python -m pytest tests/contract/test_composition_engine.py -q -rs
        env:
          WORKFLOW_COCKPIT_REAL_SPECIFY: ${{ runner.temp }}/engine/bin/specify

  distribution:
    name: Build and install artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m build
      - run: python tests/release/smoke.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-cockpit-distributions
          path: dist/
