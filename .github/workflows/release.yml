name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tagged commit
    uses: ./.github/workflows/test.yml

  guard:
    name: Guard the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match the package version
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - <<'PY'
          import os, workflow_cockpit

          tag = os.environ["GITHUB_REF_NAME"]
          expected = "v" + workflow_cockpit.__version__
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [verify, guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m build
      - run: python tests/release/smoke.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-cockpit-distributions
          path: dist/

  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workflow-cockpit-distributions
          path: dist/
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
