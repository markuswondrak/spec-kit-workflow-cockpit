schema_version: "1.0"

workflow:
  id: "lean-flow"
  name: "Lean Flow"
  version: "1.0.3"
  author: "workflow-cockpit"
  description: "Lean specify → plan → tasks → implement with review gates and a documentation step"

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any:
      - "opencode"
      - "claude"
      - "copilot"
      - "gemini"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' uses the project's initialized integration)"
  review_spec_verdict:
    type: string
  review_plan_verdict:
    type: string

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    verdict_input: review_spec_verdict
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: ""

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    verdict_input: review_plan_verdict
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: ""

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: ""

  - id: update-docs
    command: speckit.arc42.update-docs
    integration: "{{ inputs.integration }}"
    input:
      args: ""
