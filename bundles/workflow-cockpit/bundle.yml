schema_version: "1.0"

bundle:
  id: "workflow-cockpit"
  name: "Workflow Cockpit"
  version: "1.0.0"
  role: "developer"
  description: "Dogfooding stack for Workflow Cockpit: the lean-workflow preset, the arc42 documentation extension, and the lean-flow workflow in one bundle."
  author: "workflow-cockpit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"
  tools: []
  mcp: []

# Integration-agnostic: inherits the project's active integration.

provides:
  extensions:
    - id: "arc42"
      version: "1.0.0"

  presets:
    - id: "lean-workflow"
      version: "1.0.0"
      priority: 1
      strategy: "replace"

  workflows:
    - id: "lean-flow"
      version: "1.0.3"

tags:
  - "workflow-cockpit"
  - "dogfooding"
