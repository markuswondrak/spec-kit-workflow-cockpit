[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-cockpit"
dynamic = ["version"]
description = "Standalone Textual cockpit that owns one Spec Kit workflow run"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Markus Wondrak" },
]
keywords = ["spec-kit", "textual", "terminal-ui", "workflow", "workflow-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.0,<9.0",
    "PyYAML>=6.0,<7.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/markuswondrak/spec-kit-workflow-cockpit"
Repository = "https://github.com/markuswondrak/spec-kit-workflow-cockpit"
Issues = "https://github.com/markuswondrak/spec-kit-workflow-cockpit/issues"

[project.optional-dependencies]
test = [
    "build>=1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
workflow-cockpit = "workflow_cockpit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "workflow_cockpit.__version__"}

[tool.setuptools.packages.find]
include = ["workflow_cockpit*"]

[tool.setuptools.package-data]
"workflow_cockpit.ui" = ["styles.tcss"]
"workflow_cockpit.styling" = ["templates/*.json"]
"workflow_cockpit.skills" = ["cockpit-run-context/SKILL.md"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["workflow_ui/prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
