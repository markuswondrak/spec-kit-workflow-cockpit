[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-cockpit"
version = "0.1.0"
description = "Standalone Textual cockpit that owns one Spec Kit workflow run"
readme = "requirements/PRD.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0,<9.0",
    "PyYAML>=6.0,<7.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6",
]

[project.scripts]
workflow-cockpit = "workflow_cockpit.cli:main"

[tool.setuptools.packages.find]
include = ["workflow_cockpit*"]

[tool.setuptools.package-data]
"workflow_cockpit.ui" = ["styles.tcss"]
"workflow_cockpit.skills" = ["cockpit-run-context/SKILL.md"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["workflow_ui/prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
